<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title> HTML Basics </title>
</head>
<!-- we can create a list to another list yes we can create-->
 
<body>
  <h1> ordered list</h1>
  <ol type="A">
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ol>
  <h1> unordered list</h1>
    <ul type="circle">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
  <h1> description list</h1>
    <dl>
        <dt>Term 1</dt>
        <dd>Description for Term 1</dd>
        <dt>Term 2</dt>
        <dd>Description for Term 2</dd>
        <dt>Term 3</dt>
        <dd>Description for Term 3</dd>
    </dl>
</body>

</html>
