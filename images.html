<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>HTML List</title>
</head>

<body>
    <figure>
        <img src="emplyee.png" alt="Employee Image" width="200" height="200" />
        <figcaption>Employee Image</figcaption>
    </figure>
    <!-- clr k c we can use for commenting the code  -->
    <!-- clr k u for uncommenting  -->
    <!-- figure is used for grouping an image with a caption -->
    <!-- figcaption is used for providing a caption or description for the image -->
