<!DOCTYPE html>
<!-- whenever u design the element in html it folloes 3 styles margin, border, and padding-->
<!-- p is block level element enter row accupy  span is inline level element not entire row-->
<html>

<head>
    <meta charset="UTF-8">
    <title> HTML Basics </title>
    <style>
        p {
            border: 2px solid black;
            margin: 20px;
            padding: 30px;
        }

        span {
            border: 2px solid red;
            margin: 20px;
            padding: 30px;
            /*covert into block level element or inline block also*/
            display: block;
        }
    </style>
</head>

<body>
    <P>
        My paragraph
    </P>
    <span>My span</span>
</body>

</html>
